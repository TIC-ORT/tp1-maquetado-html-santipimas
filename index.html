<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="app-logo"></div>
        <nav class="app-nav">
            <ul class="app-nav-list">
                <li class="app-nav-item app-item-primary"></li>
                <li class="app-nav-item app-item-secondary"></li>
                <li class="app-nav-item app-item-alert"></li>
            </ul>
        </nav>
    </header>
    <main class="app-main">
        <article class="app-article-small">
            <figure class="app-img-wrapper">
                <div class="app-img-inner"></div>
            </figure>
            <div class="app-line-block"></div>
            <div class="app-line-block"></div>
            <div class="app-line-block"></div>
            <div class="app-btn">
                <span class="app-span-line"></span>
            </div>
        </article>
        <article class="app-article-large">
            <span class="app-triangle-left app-triangle-nav"></span>
            <section class="app-section">
                <div class="app-title"></div>
                <div class="app-line-fill"></div>
                <div class="app-line-fill"></div>
                <div class="app-line-fill"></div>
                <div class="app-line-fill"></div>
                <div class="app-line-fill"></div>
            </section>
            <span class="app-triangle-right app-triangle-nav"></span>
        </article>
    </main>
    <section class="app-gallery-section">
        <div class="app-images-left">
            <div class="app-image-group-a">
                <figure class="app-image-box"></figure>
                <figure class="app-image-box"></figure>
            </div>
            <div class="app-image-group-b">
                <figure class="app-image-box"></figure>
                <figure class="app-image-box"></figure>
            </div>
        </div>
        <div class="app-image-wrapper">
            <figure class="app-image-large"></figure>
        </div>
        <div class="app-images-right">
            <figure class="app-image-box"></figure>
            <figure class="app-image-box"></figure>
        </div>
    </section>
    <section class="app-news-section">
        <div class="app-news-block">
            <figure class="app-news-thumb"></figure>
            <div class="app-news-title"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
        </div>
        <div class="app-news-block" style="margin-left: 30px;">
            <figure class="app-news-thumb"></figure>
            <div class="app-news-title"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
        </div>
        <div class="app-news-block" style="margin-left: 30px;">
            <figure class="app-news-thumb"></figure>
            <div class="app-news-title"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
        </div>
        <div class="app-news-block" style="margin-left: 30px;">
            <figure class="app-news-thumb"></figure>
            <div class="app-news-title"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
            <div class="app-news-line"></div>
        </div>
    </section>
</body>
</html>
